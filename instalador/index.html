<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; media-src 'self' file:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>ZeroCord • Instalador</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body class="estado-inicio">
  <!-- Fundo: cenas animadas -->
  <div id="cenas">
    <video id="cenaA" muted autoplay loop playsinline></video>
    <video id="cenaB" muted autoplay loop playsinline></video>
  </div>
  <div class="veu"></div>
  <div class="codigo-fundo">002</div>

  <!-- Barra de título -->
  <div class="titulo-janela">
    <div class="tag">CODE:002</div>
    <span>ZeroCord · Instalador</span>
    <div class="espaco"></div>
    <button class="jb" data-acao="minimizar" title="Minimizar">
      <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="5.5" width="10" height="1.2" rx=".6" fill="currentColor"/></svg>
    </button>
    <button class="jb fechar" data-acao="fechar" title="Fechar">
      <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
  </div>

  <!-- Zero Two -->
  <div id="palco">
    <div id="balao">Pronto pra começar, darling?</div>
    <img id="zt" src="midia/zt-sorrindo.webp" alt="">
  </div>

  <!-- Painel -->
  <main id="painel">
    <div class="marca">
      <div class="icone">
        <span class="chifre e"></span><span class="chifre d"></span>
        <img src="../icones/icone-instalador.png" alt="">
      </div>
      <div>
        <h1>ZeroCord</h1>
        <p>Instalador · Edição Zero Two</p>
      </div>
    </div>

    <div class="secao">
      <div class="rotulo">Onde instalar</div>
      <div id="lista"></div>
    </div>

    <div class="opcoes">
      <label class="op">
        <input type="checkbox" id="op-icone" checked>
        <span class="caixa"></span>
        <img src="../icones/icone-discord.png" alt="" class="mini">
        <span>Trocar o ícone do Discord pela Zero Two</span>
      </label>
      <label class="op">
        <input type="checkbox" id="op-abrir" checked>
        <span class="caixa"></span>
        <span>Abrir o Discord quando terminar</span>
      </label>
    </div>

    <div class="botoes">
      <button id="instalar" class="principal"><span>Instalar</span></button>
      <button id="desinstalar" class="secundario">Desinstalar</button>
      <button id="pasta" class="link">Pasta das configurações</button>
    </div>

    <div class="progresso"><div></div></div>
    <div id="log"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
