name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build portable installer
        run: npx electron-builder --config installer/electron-builder.json --publish never

      - name: Smoke test (open the installer on Windows)
        shell: pwsh
        run: |
          $exe = Get-ChildItem "dist/installer/win-unpacked" -Filter *.exe | Select-Object -First 1
          $env:ZEROCORD_SMOKE = "$PWD\smoke.json"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error "Installer did not respond within 60s" }
          Get-Content smoke.json
          if ($p.ExitCode -ne 0) { Write-Error "Installer smoke test failed" }

      - name: Startup time of the portable .exe
        shell: pwsh
        run: |
          $env:ZEROCORD_SMOKE = "$PWD\\smoke-portable.json"
          $t = Measure-Command { Start-Process -FilePath "dist/installer/ZeroCord-Installer.exe" -Wait }
          "Portable .exe opened and closed in {0:N1}s" -f $t.TotalSeconds
          Get-Content smoke-portable.json -ErrorAction SilentlyContinue
          "Size: {0:N0} MB" -f ((Get-Item dist/installer/ZeroCord-Installer.exe).Length / 1MB)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v2.0.0' }}
          name: ZeroCord ${{ github.ref_type == 'tag' && github.ref_name || 'v2.0.0' }}
          files: dist/installer/ZeroCord-Installer.exe
          body: |
            ## Download

            **[ZeroCord-Installer.exe](https://github.com/${{ github.repository }}/releases/latest/download/ZeroCord-Installer.exe)** — no Node.js or setup required.

            1. Close Discord.
            2. Run `ZeroCord-Installer.exe`.
            3. Select your Discord clients (Stable, PTB, Canary) and click **Install**.

            > Windows SmartScreen may show a warning because the installer isn't code-signed. Click **More info → Run anyway**.

            Run the installer again at any time to reinstall or uninstall.
